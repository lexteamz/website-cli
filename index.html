<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div class="input-line">
            <span class="prompt">&gt;</span><span id="inputDisplay"></span><span class="cursor" id="cursor"></span>
        </div>
        <input
            type="text"
            id="commandInput"
            class="terminal-input"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
        >
    </div>
    <script src="assets/js/terminal.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
